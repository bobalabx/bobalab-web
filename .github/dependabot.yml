# Dependency updates (brief §G4; WP8). Security alerts and Dependabot security
# updates are switched on in the repository settings (docs/SETUP-PRODUCTION.md §B).
#
# - npm versions stay exact (.npmrc save-exact): Dependabot bumps the pin.
# - next must never go below 16.4.1 (security floor, brief §F1).
# - Majors of the framework, React, TypeScript and Node types are ignored:
#   they need a planned migration (H-13: Next 17 makes Cache Components the
#   default; typescript-eslint needs TypeScript < 6.1; the site runs Node 24 LTS).
# - Decap CMS is vendored in public/admin/ (not an npm dependency): bump it with
#   scripts/cms (docs/HANDOVER.md "Decap bump").
# - GitHub Actions are pinned by commit SHA; Dependabot updates the SHA and the
#   "# vX.Y.Z" comment together.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      framework:
        patterns:
          ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
