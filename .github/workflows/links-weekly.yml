# Weekly external link check (brief §G5 "weekly"; WP8).
#
# Builds the production export and runs lychee over it and over content/, so
# DOIs rendered as https://doi.org/… links are checked as well as plain URLs.
# Internal links are ci.yml's `links` job (linkinator) on every PR.
# Broken links open (or update) one issue instead of failing silently.
# Publishers and SSRN often answer bots with 403/429, so those count as OK
# here; a human checks them in the browser when an issue lists them.

name: External links (weekly)

on:
  schedule:
    # Mondays 14:41 UTC (07:41 in Berkeley during daylight time); off the hour.
    - cron: "41 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-weekly
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production export
        run: npm run build
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The action evals these args in bash: keep regexes in single quotes.
          # Only http(s) links are checked; root-relative site links resolve to
          # files under out/ and are skipped (file scheme).
          args: >-
            --no-progress
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --scheme https --scheme http
            --accept 100..=103,200..=299,403,429
            --root-dir '${{ github.workspace }}/out'
            --exclude-path out/admin
            --exclude-path out/_next
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https://bobalab-berkeley\.github\.io'
            --exclude '^https://example\.(com|org|invalid)'
            'out/**/*.html'
            'content/**/*.md'
            'content/**/*.yml'
          output: lychee/report.md
          format: markdown
          jobSummary: true
          fail: false
      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Broken external links (weekly check)"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { echo "Found by $RUN_URL"; echo; cat lychee/report.md; } > lychee/issue.md
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file lychee/issue.md
          else
            gh issue create --title "$TITLE" --body-file lychee/issue.md
          fi
