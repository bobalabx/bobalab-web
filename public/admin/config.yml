          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
  - name: people
    label: People
    label_singular: Person
    description: The PI, lab members and alumni. External coauthors are not people. Nobody appears on the site unless “Listed” is on, and photos, email and “now at” need their own consent switches.
    folder: content/people
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}}{{fields.listed | ternary('', ' · not listed')}}{{fields.draft | ternary(' · draft', '')}}"
    sortable_fields:
      - name
      - role
      - end
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Not listed
        field: listed
        pattern: false
    view_groups:
      - label: Role
        field: role
    fields:
      - label: Name
        name: name
        widget: string
        pattern:
          - (?=^[\s\S]{0,120}$)
          - At most 120 characters.
        required: true
        hint: As the person wants it shown. The file name (first-last) is made from it.
      - label: Role
        name: role
        widget: select
        options:
          - label: Principal investigator
            value: pi
          - label: Postdoc
            value: postdoc
          - label: PhD student
            value: phd
          - label: Pre-doc or staff
            value: predoc-staff
          - label: Master’s student
            value: masters
          - label: Undergraduate
            value: undergrad
          - label: Affiliate (only with written consent)
            value: affiliate
        multiple: false
        required: true
      - label: Position title
        name: title
        widget: string
        pattern:
          - (?=^[\s\S]{0,160}$)
          - At most 160 characters.
        required: false
        hint: e.g. the PI’s faculty title.
      - label: Program
        name: program
        widget: string
        pattern:
          - (?=^[\s\S]{0,120}$)
          - At most 120 characters.
        required: false
        hint: As the member wishes, e.g. “EECS & Data Science”.
      - label: Start
        name: start
        widget: string
        pattern:
          - (?=^\d{4}(-(0[1-9]|1[0-2]))?$)
          - Use YYYY or YYYY-MM, e.g. 2026-09.
        required: false
        hint: YYYY or YYYY-MM.
      - label: End
        name: end
        widget: string
        pattern:
          - (?=^\d{4}(-(0[1-9]|1[0-2]))?$)
          - Use YYYY or YYYY-MM, e.g. 2026-09.
        required: false
        hint: YYYY or YYYY-MM. After this date the person is listed under Alumni.
      - label: Sort rank
        name: rank
        widget: number
        value_type: float
        required: false
        hint: Optional; lower numbers sort first within a group.
      - label: Interests
        name: interests
        widget: list
        field:
          label: Interest
          name: interest
          widget: string
          pattern:
            - (?=^[\s\S]{0,60}$)
            - At most 60 characters.
          required: true
        allow_add: true
        max: 3
        required: false
        default: []
        hint: Up to 3 short phrases.
        label_singular: interest
        summary: "{{fields.interest}}"
      - label: Research directions
        name: directions
        widget: relation
        collection: directions
        value_field: "{{slug}}"
        search_fields:
          - title
          - short_label
        display_fields:
          - short_label
        options_length: 100
        multiple: true
        required: false
        default: []
        hint: The directions (pearls) this belongs to.
      - label: Image
        name: photo
        widget: image
        required: false
        hint: "Upload only after the person has agreed in writing: uploaded files are public as soon as they are published, even while “Photo consent” is off, so the CMS does not save a photo without that consent. Square headshot, JPG or WebP, at most 2 MB."
        choose_url: false
        media_library:
          config:
            max_file_size: 2097152
      - label: Photo alt text (required with a photo)
        name: photo_alt
        widget: string
        pattern:
          - (?=^[\s\S]{0,300}$)
          - At most 300 characters.
        required: false
        hint: Required when a photo is set, e.g. “Portrait of Jane Doe”.
      - label: Photo consent
        name: photo_consent
        widget: boolean
        required: false
        default: false
        hint: On only after the person agreed in writing that their photo may be shown.
      - label: Links
        name: links
        widget: object
        fields:
          - label: Haas faculty profile
            name: haas
            widget: string
            pattern:
