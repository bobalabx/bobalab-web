# GENERATED by scripts/cms/build-config.mjs. Do not edit by hand.
# Source: cms/source.mjs (labels, widgets, backend) + src/lib/content/schema.ts (fields, constraints).
# Change the source, run `node scripts/cms/build-config.mjs`, commit both. tests/unit/cms checks parity.
backend:
  name: github
  repo: bobalabx/bobalab-web
  branch: main
  base_url: https://bobalab-cms-auth.bobalabx-034.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo
  squash_merges: true
  cms_label_prefix: decap/
publish_mode: editorial_workflow
site_url: https://bobalabx.github.io/bobalab-web
display_url: https://bobalabx.github.io/bobalab-web
logo:
  src: logo.svg
  show_in_header: false
show_preview_links: false
media_folder: public/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
editor:
  preview: true
collections:
  - name: news
    label: News
    label_singular: News item
    description: Lab news, newest first. The file name starts with the date (yyyy-mm-dd-…) and is set when you first save, so fill in the date before saving.
    folder: content/news
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{fields.date | date('YYYY-MM-DD')}}-{{slug | truncate(60)}}"
    identifier_field: title
    summary: "{{fields.date | date('YYYY-MM-DD')}} · {{title}}{{fields.draft | ternary(' · draft', '')}}"
    sortable_fields:
      - field: date
        default_sort: desc
      - title
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Talks and events
        field: type
        pattern: talk
    view_groups:
      - label: Year
        field: date
        pattern: \d{4}
    fields:
      - label: Date
        name: date
        widget: datetime
        pattern:
          - (?=^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])([T ]([01]\d|2[0-3]):[0-5]\d(:[0-5]\d(\.\d+)?)?(Z|[+-]\d{2}:?\d{2})?)?$)
          - Use a date YYYY-MM-DD (optionally with a time).
        required: true
        hint: The day of the news (shown in full on the site). Also used in the file name.
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
      - label: Type
        name: type
        widget: select
        options:
          - label: Publication
            value: publication
          - label: Award
            value: award
          - label: Talk or event
            value: talk
          - label: Media coverage
            value: media
          - label: People
            value: people
          - label: Grant
            value: grant
          - label: Lab life
            value: lab-life
        multiple: false
        required: true
      - label: Title
        name: title
        widget: string
        pattern:
          - (?=^[\s\S]{0,160}$)
          - At most 160 characters.
        required: true
        hint: ≤ 160 characters.
      - label: Summary
        name: summary
        widget: text
        pattern:
          - (?=^[\s\S]{0,280}$)
          - At most 280 characters.
        required: false
        hint: One or two sentences shown in lists and feeds (≤ 280 characters).
      - label: Event date
        name: event_date
        widget: datetime
        pattern:
          - (?=^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])([T ]([01]\d|2[0-3]):[0-5]\d(:[0-5]\d(\.\d+)?)?(Z|[+-]\d{2}:?\d{2})?)?$)
          - Use a date YYYY-MM-DD (optionally with a time).
        required: false
        hint: Talks and events only. Items with a future event date are shown as “Upcoming”.
        format: YYYY-MM-DDTHH:mm
        date_format: YYYY-MM-DD
        time_format: HH:mm
      - label: Location
        name: location
        widget: string
        pattern:
          - (?=^[\s\S]{0,160}$)
          - At most 160 characters.
        required: false
        hint: Talks and events only, e.g. “INFORMS Annual Meeting, Atlanta”.
      - label: People
        name: people
        widget: relation
        collection: people
        value_field: "{{slug}}"
        search_fields:
          - name
        display_fields:
          - name
        filters:
          - field: listed
            values:
              - true
        options_length: 100
        multiple: true
        required: false
        default: []
        hint: Lab members this is about. Only people who agreed to be listed can be chosen.
      - label: Research directions
        name: directions
        widget: relation
        collection: directions
        value_field: "{{slug}}"
        search_fields:
          - title
          - short_label
        display_fields:
          - short_label
        options_length: 100
        multiple: true
        required: false
        default: []
        hint: The directions (pearls) this belongs to.
      - label: Publications
        name: publications
        widget: relation
        collection: publications
        value_field: "{{slug}}"
        search_fields:
          - title
        display_fields:
          - title
          - year
        options_length: 100
        multiple: true
        required: false
        default: []
        hint: Papers this item is about.
      - label: Link
        name: link
        widget: object
        fields:
          - label: Link text
            name: label
            widget: string
            required: false
            hint: Say where it goes, e.g. “Conference programme”.
          - label: Address
            name: url
            widget: string
            pattern:
              - (?=^(?:https://\S+|/(?![/\\])\S*)$)
              - Use a full https:// address or a site path starting with /.
            required: false
            hint: https://… or a site path such as /publications/…/
        required: false
        hint: Optional link to the event page, article or announcement.
        collapsed: true
      - label: Image
        name: image
        widget: object
        fields:
          - label: Image
            name: image
            widget: image
            required: false
            hint: Upload a JPG, PNG, WebP or GIF (at most 2 MB). External image links are not allowed.
            choose_url: false
            media_library:
              config:
                max_file_size: 2097152
          - label: Alt text (required with an image)
            name: alt
            widget: string
            pattern:
              - (?=^[\s\S]{0,300}$)
              - At most 300 characters.
            required: false
            hint: Required when an image is set. Say what the image shows and why it matters, in a sentence (≤ 300 characters). Do not start with “Image of”.
          - label: Caption
            name: caption
            widget: text
            pattern:
              - (?=^[\s\S]{0,400}$)
              - At most 400 characters.
            required: false
            hint: Optional, shown under the image (≤ 400 characters).
        required: false
        hint: Optional picture for the news page.
        collapsed: true
      - label: Draft · pending lab review
        name: draft
        widget: boolean
        required: false
        default: false
        hint: "On: shown only in preview builds, with a “Draft · pending lab review” badge; the live site leaves it out. Turn it off once the lab has approved the text. This is separate from the CMS’s own Draft → In review → Ready board."
      - label: Body
        name: body
        widget: richtext
        required: false
        default: ""
        hint: Optional longer text for the news page.
        editor_components: []
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
  - name: publications
    label: Publications
    label_singular: Publication
    description: Papers, working papers and work in progress. The file name is made from the first author, the year and the title when you first save. Papers count toward a direction only when they have a public version (DOI, SSRN, arXiv, PDF, publisher link) or a documented presentation.
    folder: content/publications
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{fields.authors.0.name}}-{{year}}-{{slug | truncate(28)}}"
    identifier_field: title
    summary: "{{fields.year | default('in progress')}} · {{title}}{{fields.draft | ternary(' · draft', '')}}"
    sortable_fields:
      - field: year
        default_sort: desc
      - title
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
      - label: Featured
        field: featured
        pattern: true
      - label: Work in progress
        field: type
        pattern: work-in-progress
    view_groups:
      - label: Year
        field: year
        pattern: \d{4}
    fields:
      - label: Title
        name: title
        widget: string
        pattern:
          - (?=^[\s\S]{0,300}$)
          - At most 300 characters.
        required: true
        hint: As in the paper (≤ 300 characters).
      - label: Authors
        name: authors
        widget: list
        fields:
          - label: Name
            name: name
            widget: string
            required: true
            hint: As printed on the paper.
          - label: Lab person
            name: person
            widget: relation
            collection: people
            value_field: "{{slug}}"
            search_fields:
              - name
            display_fields:
              - name
            filters:
              - field: listed
                values:
                  - true
            options_length: 100
            multiple: false
            required: false
            hint: Only for the PI, lab members and alumni who are listed.
          - label: Web page
            name: url
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: Optional, for external coauthors (https://…).
        collapsed: true
        allow_add: true
        min: 1
        required: true
        hint: In the paper’s order. Link lab members to their person entry; external coauthors get a name (and optionally a web page) only, never a person entry.
        summary: "{{fields.name}}"
      - label: Type
        name: type
        widget: select
        options:
          - label: Journal article
            value: journal
          - label: Working paper
            value: working-paper
          - label: Conference paper
            value: conference
          - label: Book chapter
            value: chapter
          - label: Dissertation
            value: dissertation
          - label: Work in progress
            value: work-in-progress
          - label: Other
            value: other
        multiple: false
        required: true
      - label: Venue
        name: venue
        widget: string
        required: false
        hint: Journal or conference, e.g. Management Science.
      - label: Year (required with a public version)
        name: year
        widget: number
        value_type: int
        min: 1990
        step: 1
        required: false
        hint: Publication year (1990 to next year). Needed once the paper has a DOI, PDF, SSRN, arXiv or publisher link, or a presentation link. Leave empty for work in progress.
      - label: Online date
        name: date_online
        widget: string
        pattern:
          - (?=^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$)
          - Use YYYY, YYYY-MM or YYYY-MM-DD.
        required: false
        hint: "Journals only: first online. YYYY, YYYY-MM or YYYY-MM-DD, e.g. 2026-10."
      - label: Volume
        name: volume
        widget: string
        required: false
      - label: Issue
        name: issue
        widget: string
        required: false
      - label: Pages
        name: pages
        widget: string
        required: false
        hint: e.g. 123–145 or an article number.
      - label: DOI
        name: doi
        widget: string
        pattern:
          - (?=^10\.\d{4,9}\/\S+$)
          - A DOI starts with 10. followed by a slash, e.g. 10.1287/mnsc.2023.01234.
        required: false
        hint: Only the DOI itself, e.g. 10.1287/mnsc.2023.01234 (no https://doi.org/).
      - label: Status
        name: status
        widget: select
        options:
          - label: Published
            value: published
          - label: Forthcoming
            value: forthcoming
          - label: Accepted
            value: accepted
          - label: Major revision
            value: major-revision
          - label: Revise and resubmit
            value: revise-resubmit
          - label: Submitted
            value: submitted
          - label: Working paper
            value: working-paper
          - label: Preprint
            value: preprint
          - label: In progress
            value: in-progress
        multiple: false
        required: true
        hint: Anything other than Published also needs “As of” and “Status source”.
      - label: Status note
        name: status_note
        widget: string
        pattern:
          - (?=^[\s\S]{0,200}$)
          - At most 200 characters.
        required: false
        hint: e.g. “at Manufacturing & Service Operations Management, 2nd round”.
      - label: Status source (required unless Published)
        name: status_source
        widget: select
        options:
          - label: Documented (a public record shows it)
            value: documented
          - label: Self-reported (the lab or a CV says so)
            value: self-reported
        multiple: false
        required: false
        hint: Self-reported statuses are labelled “reported by the lab” on the site.
      - label: As of (required unless Published)
        name: as_of
        widget: string
        pattern:
          - (?=^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$)
          - Use YYYY, YYYY-MM or YYYY-MM-DD.
        required: false
        hint: When the status was last checked. YYYY, YYYY-MM or YYYY-MM-DD, e.g. 2026-10.
      - label: Links and materials
        name: links
        widget: object
        fields:
          - label: PDF
            name: pdf
            widget: file
            required: false
            hint: "Prefer a link to the publisher, SSRN or arXiv copy (use “Insert from URL”). Uploads: PDF only, at most 10 MB, and the PDF must be accessible (docs/EDITING.md, PDF checklist)."
            choose_url: true
            media_library:
              config:
                max_file_size: 10485760
          - label: SSRN
            name: ssrn
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: A full address starting with https://
          - label: arXiv
            name: arxiv
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: A full address starting with https://
          - label: Publisher page
            name: publisher
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: A full address starting with https://
          - label: Code
            name: code
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: A full address starting with https://
          - label: Data
            name: data
            widget: string
            pattern:
              - (?=^(?:https://\S+|/(?![/\\])\S*)$)
              - Use a full https:// address or a site path starting with /.
            required: false
            hint: https://… or a site path.
          - label: Slides
            name: slides
            widget: file
            required: false
            hint: Link (“Insert from URL”) or upload a PDF of the slides (at most 10 MB, accessible PDF).
            choose_url: true
            media_library:
              config:
                max_file_size: 10485760
          - label: Video
            name: video
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: A full address starting with https://
        required: false
        collapsed: true
      - label: Presentations
        name: presentations
        widget: list
        fields:
          - label: Event
            name: event
            widget: string
            pattern:
              - (?=^[\s\S]{0,200}$)
              - At most 200 characters.
            required: true
          - label: Year
            name: year
            widget: number
            value_type: int
            min: 1990
            step: 1
            required: false
          - label: Evidence link
            name: url
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: Programme page or recording (https://…).
        collapsed: true
        allow_add: true
        required: false
        default: []
        hint: Conference talks. Add a link to a programme page or recording only when one exists; a talk with such a link counts as a public version.
        summary: "{{fields.event}}"
      - label: Press
        name: press
        widget: list
        fields:
          - label: Outlet
            name: outlet
            widget: string
            required: true
          - label: Article link
            name: url
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: true
            hint: A full address starting with https://
          - label: Date
            name: date
            widget: string
            pattern:
              - (?=^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$)
              - Use YYYY, YYYY-MM or YYYY-MM-DD.
            required: false
            hint: YYYY, YYYY-MM or YYYY-MM-DD, e.g. 2026-10.
        collapsed: true
        allow_add: true
        required: false
        default: []
        summary: "{{fields.outlet}}"
      - label: Awards
        name: awards
        widget: list
        fields:
          - label: Award
            name: name
            widget: string
            required: true
          - label: Year
            name: year
            widget: number
            value_type: int
            min: 1990
            step: 1
            required: true
          - label: Awarded under the title
            name: under_title
            widget: string
            required: false
            hint: Only if the paper had a different title then.
          - label: Source
            name: source
            widget: select
            options:
              - label: Documented (the awarding body lists it)
                value: documented
              - label: Self-reported (only the lab or a CV says so)
                value: self-reported
            multiple: false
            required: false
            hint: Self-reported awards are labelled “reported by the lab” on the paper page.
        collapsed: true
        allow_add: true
        required: false
        default: []
        summary: "{{fields.name}} ({{fields.year}})"
      - label: Research directions (required except for work in progress)
