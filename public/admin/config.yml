  - name: directions
    label: Research directions
    label_singular: Research direction
    description: The pearls of Fig. 1. Their order is set in Settings → Site → Direction order, not here. Archive a direction instead of deleting it.
    folder: content/directions
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{fields.short_label}}"
    identifier_field: title
    summary: "{{short_label}} · {{status}}{{fields.draft | ternary(' · draft', '')}}"
    sortable_fields:
      - title
      - status
    view_filters:
      - label: Archived
        field: status
        pattern: archived
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - label: Title
        name: title
        widget: string
        pattern:
          - (?=^[\s\S]{0,90}$)
          - At most 90 characters.
        required: true
        hint: ≤ 90 characters.
      - label: Short label
        name: short_label
        widget: string
        pattern:
          - (?=^[\s\S]{0,28}$)(?=^[^\r\n<>]+$)
          - One line, at most 28 characters, without < or >.
        required: true
        hint: "The pearl’s label in Fig. 1: one line, ≤ 28 characters. Also the file name."
      - label: Guiding question
        name: question
        widget: text
        pattern:
          - (?=^[\s\S]{0,140}$)
          - At most 140 characters.
        required: false
        hint: ≤ 140 characters.
      - label: Summary
        name: summary
        widget: text
        pattern:
          - (?=^[\s\S]{0,160}$)
          - At most 160 characters.
        required: false
        hint: One sentence, ≤ 160 characters.
      - label: Colour
        name: color
        widget: select
        options:
          - label: Butterfly pea (blue)
            value: butterfly-pea
          - label: Oolong (amber)
            value: oolong
          - label: Lychee (rose)
            value: lychee
          - label: Matcha (green)
            value: matcha
          - label: Jasmine (teal)
            value: jasmine
          - label: Black sesame (charcoal)
            value: black-sesame
          - label: Taro (violet, reserve)
            value: taro
          - label: Thai tea (orange, reserve)
            value: thai-tea
        multiple: false
        required: true
        hint: Each direction needs its own colour. Butterfly pea/Taro and Oolong/Thai tea look alike to many colour-blind readers, so avoid those pairs (docs/EDITING.md).
      - label: Active since
        name: active_since
        widget: number
        value_type: int
        min: 1990
        step: 1
        required: false
        hint: Year.
      - label: Status
        name: status
        widget: select
        options:
          - label: Active
            value: active
          - label: Emerging
            value: emerging
          - label: Archived (off Fig. 1, page kept)
            value: archived
        multiple: false
        required: false
        default: active
        hint: "Archive instead of deleting: the page stays with a dated “Archived” note."
      - label: Archived on
        name: archived_on
        widget: string
        pattern:
          - (?=^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$)
          - Use YYYY, YYYY-MM or YYYY-MM-DD.
        required: false
        hint: Set when archiving. YYYY, YYYY-MM or YYYY-MM-DD, e.g. 2026-10.
      - label: Open to collaborators
        name: open_to_collaborators
        widget: boolean
        required: false
        default: false
      - label: Methods
        name: methods
        widget: list
        field:
          label: Method
          name: method
          widget: string
          pattern:
            - (?=^[\s\S]{0,40}$)
            - At most 40 characters.
          required: true
        allow_add: true
        max: 6
        required: false
        default: []
        hint: Up to 6 short method names (≤ 40 characters each).
        label_singular: method
        summary: "{{fields.method}}"
      - label: Key findings
        name: findings
        widget: list
        fields:
          - label: Finding
            name: text
            widget: text
            pattern:
              - (?=^[\s\S]{0,240}$)
              - At most 240 characters.
            required: true
            hint: ≤ 240 characters.
          - label: Paper
            name: publication
            widget: relation
            collection: publications
            value_field: "{{slug}}"
            search_fields:
              - title
            display_fields:
              - title
              - year
            options_length: 100
            multiple: false
            required: false
          - label: Evidence
            name: evidence
            widget: select
            options:
              - label: Published (peer reviewed)
                value: published
              - label: Working paper
                value: working-paper
              - label: Preliminary
                value: preliminary
            multiple: false
            required: true
            hint: How strong the support is. Shown next to the finding.
        collapsed: true
        allow_add: true
        max: 4
        required: false
        default: []
        hint: Up to 4. Plain-language findings, each tied to a paper where possible.
        summary: "{{fields.text | truncate(60)}}"
      - label: Figure
        name: figure
        widget: object
        fields:
          - label: Image
            name: image
            widget: image
            required: false
            hint: Upload a JPG, PNG, WebP or GIF (at most 2 MB). External image links are not allowed.
            choose_url: false
            media_library:
              config:
                max_file_size: 2097152
          - label: Alt text (required with an image)
            name: alt
            widget: string
            pattern:
              - (?=^[\s\S]{0,300}$)
              - At most 300 characters.
            required: false
            hint: Required when an image is set. Say what the image shows and why it matters, in a sentence (≤ 300 characters). Do not start with “Image of”.
          - label: Caption
            name: caption
            widget: text
            pattern:
              - (?=^[\s\S]{0,400}$)
              - At most 400 characters.
            required: false
            hint: Optional, shown under the image (≤ 400 characters).
          - label: What this shows
            name: what_this_shows
            widget: text
            pattern:
              - (?=^[\s\S]{0,600}$)
              - At most 600 characters.
            required: false
            hint: Optional plain-language reading of the figure (≤ 600 characters).
        required: false
        hint: Optional figure for the direction page.
        collapsed: true
      - label: Draft · pending lab review
        name: draft
        widget: boolean
        required: false
        default: false
        hint: "On: shown only in preview builds, with a “Draft · pending lab review” badge; the live site leaves it out. Turn it off once the lab has approved the text. This is separate from the CMS’s own Draft → In review → Ready board."
      - label: Body
        name: body
        widget: richtext
        required: false
        default: ""
        hint: 80–150 words introducing the direction.
        editor_components: []
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
