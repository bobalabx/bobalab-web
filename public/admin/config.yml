  - name: settings
    label: Settings
    description: Site-wide settings. Changes affect every page.
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: Site
        file: content/site.yml
        fields:
          - label: Short name
            name: name
            widget: string
            pattern:
              - (?=^[\s\S]{1,}$)
              - At least 1 characters.
            required: false
            default: BOBALAB
          - label: Full lab name
            name: long_name
            widget: string
            required: true
          - label: Affiliation (plain text)
            name: affiliation_text
            widget: string
            required: true
          - label: Lab email
            name: email
            widget: string
            pattern:
              - (?=^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$)
              - Use an email address such as name@berkeley.edu.
            required: true
          - label: Postal address
            name: address
            widget: string
            required: true
          - label: Site address
            name: site_url
            widget: string
            pattern:
              - (?=^https://\S+$)
              - Use a full address starting with https://.
            required: false
            hint: Canonical origin without the path, e.g. https://bobalabx.github.io
          - label: Social links
            name: social
            widget: object
            fields:
              - label: Bluesky
                name: bluesky
                widget: string
                pattern:
                  - (?=^https://\S+$)
                  - Use a full address starting with https://.
                required: false
                hint: A full address starting with https://
              - label: X
                name: x
                widget: string
                pattern:
                  - (?=^https://\S+$)
                  - Use a full address starting with https://.
                required: false
                hint: A full address starting with https://
              - label: LinkedIn
                name: linkedin
                widget: string
                pattern:
                  - (?=^https://\S+$)
                  - Use a full address starting with https://.
                required: false
                hint: A full address starting with https://
              - label: GitHub
                name: github
                widget: string
                pattern:
                  - (?=^https://\S+$)
                  - Use a full address starting with https://.
                required: false
                hint: A full address starting with https://
              - label: YouTube
                name: youtube
                widget: string
                pattern:
                  - (?=^https://\S+$)
                  - Use a full address starting with https://.
                required: false
                hint: A full address starting with https://
              - label: Mastodon
                name: mastodon
                widget: string
                pattern:
                  - (?=^https://\S+$)
                  - Use a full address starting with https://.
                required: false
                hint: A full address starting with https://
            required: false
            collapsed: true
          - label: Maintainers
            name: maintainers
            widget: text
            required: false
            hint: Who maintains the site (shown in the footer).
          - label: Fig. 1 layout
            name: figure_mode
            widget: select
            options:
              - label: Cluster (default)
                value: cluster
              - label: Dot plot (better for 7–8 directions)
                value: dotplot
            multiple: false
            required: false
            default: cluster
          - label: Editors’ note
            name: editors_note
            widget: text
            required: false
            hint: Internal note for editors; not shown on the site.
          - label: Launched
            name: launched
            widget: boolean
            required: false
            default: false
            hint: Off until the public launch. While off, having no published directions is only a warning.
          - label: Direction order
            name: direction_order
            widget: list
            field:
              label: Direction
              name: direction
              widget: relation
              collection: directions
              value_field: "{{slug}}"
              search_fields:
                - title
                - short_label
              display_fields:
                - short_label
              options_length: 100
              multiple: false
              required: true
              filters:
                - field: status
                  values:
                    - active
                    - emerging
            allow_add: true
            required: false
            default: []
            hint: "The order of the pearls in Fig. 1. Each item shows the direction’s address (e.g. ai-at-work). Drag an item by its handle, or focus the handle and use Space, the arrow keys and Space again. Each live direction once; remove archived directions (×). An item that opens as an empty choice is an archived direction: remove it."
            label_singular: direction
            summary: "{{fields.direction}}"
          - label: Redirects
            name: redirects
            widget: list
            fields:
              - label: Old address
                name: from
                widget: string
                pattern:
                  - (?=^\/([a-z0-9-]+\/)+$)
                  - A site path in lower case with a slash at both ends, e.g. /research/old-slug/.
                required: true
                hint: A site path such as /research/old-slug/ (with slashes).
              - label: New address
                name: to
                widget: string
                pattern:
                  - (?=^(?:https://\S+|/(?![/\\])\S*)$)
                  - Use a full https:// address or a site path starting with /.
                required: true
                hint: A site path such as /research/new-slug/ or https://…
            collapsed: true
            allow_add: true
            required: false
            default: []
            hint: When a published page’s address changes or a page is removed, send the old address somewhere useful.
            summary: "{{fields.from}} → {{fields.to}}"
