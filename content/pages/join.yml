intro: "BOBALAB works with Berkeley students, with academic and industry collaborators, and with journalists. One address reaches the lab: [bobalab@berkeley.edu](mailto:bobalab@berkeley.edu)."
students: |
  Undergraduates join through UC Berkeley's [Undergraduate Research Apprentice Program (URAP)](https://urapprojects.berkeley.edu/list.php?faculty_id=F-1753). The lab offers four tracks:

  - Mathematical modeling and theory
  - Experimental systems and game building
  - Research generalist and research operations
  - Data science, econometrics and algorithms

  Apprentices commit about 9–11 hours a week, and remote work is possible.

  Check the [URAP listing](https://urapprojects.berkeley.edu/list.php?faculty_id=F-1753) for the current term, or email [bobalab@berkeley.edu](mailto:bobalab@berkeley.edu).
partners: The lab welcomes academic and industry collaborators. To talk about a project, email [bobalab@berkeley.edu](mailto:bobalab@berkeley.edu).
press: For media requests, email [bobalab@berkeley.edu](mailto:bobalab@berkeley.edu).
