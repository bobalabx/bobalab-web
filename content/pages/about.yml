title: About BOBALAB
intro: BOBALAB, the Berkeley Operations and Behavioral Analytics Lab, is Prof. Park Sinchaisri's research group at the Haas School of Business, University of California, Berkeley.
body: |
  ## How we work

  Our projects draw on operations management, behavioral science, economics, computer science and human–computer interaction. Undergraduates join through UC Berkeley's Undergraduate Research Apprentice Program (URAP); look for our listing, "Improving Human-AI Interactions in the Future of Work".

  ## Principal investigator

  Park Sinchaisri is an Assistant Professor in the Operations & Information Technology Management (OITM) group at Berkeley Haas. He joined the faculty in 2021.
